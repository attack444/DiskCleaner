name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -v

  build:
    name: Build exe
    needs: test
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Build exe
        run: uv run pyinstaller --clean --noconfirm DiskCleaner.spec

      - name: Verify exe exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\DiskCleaner.exe")) {
            Write-Error "dist\DiskCleaner.exe not found"
            exit 1
          }
          Get-Item "dist\DiskCleaner.exe" | Select-Object Name, Length, LastWriteTime

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\DiskCleaner.exe" -Algorithm SHA256).Hash
          "SHA256  $hash  DiskCleaner.exe" | Out-File -FilePath checksum.txt -Encoding ASCII
          Get-Content checksum.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskCleaner-exe
          path: |
            dist/DiskCleaner.exe
            checksum.txt
          retention-days: 14

      - name: Create release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DiskCleaner.exe
            checksum.txt
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
