[project]
name = "diskcleaner"
version = "3.0.0"
description = "Мощная и безопасная очистка диска Windows"
readme = "README.md"
authors = [
    { name = "Вячеслав", email = "slavasundukov887@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "customtkinter>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.22.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]